global:
    test_home: ../testsuites
    testcase_ext: [.c, .ll]

testsuites:
    app-bugs:
    cpu0:
        compile_only: true
    csmith:
        blacklist:
            O0: ['test6.c', 'test8.c', 'test21.c', 'test23.c', 'test39.c', 'test42.c', 'test46.c']
            O1: ['test6.c', 'test8.c', 'test21.c', 'test23.c', 'test39.c', 'test42.c', 'test46.c']
            O2: ['test6.c', 'test8.c', 'test21.c', 'test23.c', 'test39.c', 'test42.c', 'test46.c']
            O3: ['test6.c', 'test8.c', 'test21.c', 'test23.c', 'test39.c', 'test42.c', 'test46.c']
    scalar:
        blacklist:
            O0: ['argtest.c', 'doubleArith.c', 'long_long_yhn.c', 'printf.c']
            O1: ['argtest.c', 'doubleArith.c', 'long_long_yhn.c', 'printf.c']
            O2: ['argtest.c', 'doubleArith.c', 'long_long_yhn.c', 'printf.c']
            O3: ['argtest.c', 'doubleArith.c', 'long_long_yhn.c', 'printf.c']
    x264:
        compile_only: true


cpus:
    dspse:
        toolchain_home: ../..
        tool:
            clang:
                flags: 
                    - -mfpmath=fp64
                    # - -mllvm
                    #- --verify-machineinstrs
                include:
                    - ../../include
                    - ./dependency/include
            llc:
                flags: 
                    - --verify-machineinstrs
            lld:
                simulator:
                    linker_script: ../../lib/dspse/link_8slots.lds
                    flags: ["-lm", "-lc", "-lrt", "-ldspsim", "-ldbgsim"]
                    lib: [../../lib/dspse]
                chip:
                    linker_script: ../../lib/dspse/link_8slots.lds
                    flags: ["-lm", "-lc", "-lrt", "-ldspsim", "-ldbgchip"]
                    lib: [../../lib/dspse]
            ld:
                simulator:
                    linker_script: ../../lib/dspse/link_8slots.x
                    flags: ["-lm", "-lc", "-lrt", "-ldspsim", "-ldbgsim"]
                    lib: [../../lib/dspse]
                chip:
                    linker_script: ../../lib/dspse/link_8slots.x
                    flags: ["-lm", "-lc", "-lrt", "-ldspsim", "-ldbgchip"]
                    lib: [../../lib/dspse]

            simulator:
                suffix: step13
                flags: [-c,dspse]


            trobjdat:
                path: ./trobjdat_8slot.py
                objcopy_dir: ../../tools

